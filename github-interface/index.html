<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile Explorer</title>
    <meta name="description" content="A beautiful GitHub profile and repository explorer.">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-glow blob-1"></div>
    <div class="bg-glow blob-2"></div>
    
    <main class="container">
        <header>
            <h1><i class="fab fa-github"></i> GitExplore</h1>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Enter GitHub username..." autocomplete="off">
                <button id="searchBtn" title="Search"><i class="fas fa-search"></i></button>
            </div>
        </header>

        <div id="loader" class="loader hidden"></div>
        <div id="errorMessage" class="error hidden"></div>

        <div id="content" class="content hidden">
            <aside class="profile-card glass-panel">
                <div class="avatar-wrapper">
                    <img id="avatar" src="" alt="Profile Avatar" class="avatar">
                </div>
                <h2 id="name"></h2>
                <a id="username" href="" target="_blank" class="username-link"></a>
                <p id="bio" class="bio"></p>
                
                <div class="stats">
                    <div class="stat-box">
                        <span class="stat-value" id="reposCount">0</span>
                        <span class="stat-label">Repos</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-value" id="followersCount">0</span>
                        <span class="stat-label">Followers</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-value" id="followingCount">0</span>
                        <span class="stat-label">Following</span>
                    </div>
                </div>

                <div class="profile-meta">
                    <p id="location" class="meta-item hidden"><i class="fas fa-map-marker-alt"></i> <span></span></p>
                    <p id="company" class="meta-item hidden"><i class="fas fa-building"></i> <span></span></p>
                    <p id="blog" class="meta-item hidden"><i class="fas fa-link"></i> <span></span></p>
                </div>
            </aside>

            <section class="repos-section">
                <h3 class="section-title">Latest Repositories</h3>
                <div id="reposGrid" class="repos-grid">
                    <!-- Repos injected here -->
                </div>
            </section>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
